<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      viewport-fit=cover so the page reaches under a phone's rounded corners and
      notch; the layout pads itself back with env(safe-area-inset-*). No
      maximum-scale or user-scalable=no - pinch-zoom must never be blocked, and
      Lighthouse fails the page for it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Safe to Spend" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Safe to Spend</title>
    <meta
      name="description"
      content="An expense tracker you talk to. Know what is safe to spend today, after your EMIs, SIPs and savings."
    />
    <!-- Tints the mobile browser's own chrome to match the page in each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdf6e3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#262233" />
    <!-- Applies the saved theme before first paint. See the file for why it is not inline. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
