<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Expense Tracker</title>
    <meta
      name="description"
      content="An expense tracker you talk to. Know what is safe to spend today, after your EMIs, SIPs and savings."
    />
    <!-- Tints the mobile browser's own chrome to match the page in each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111413" />
    <script>
      /*
       Apply the saved theme before first paint.

       React sets data-theme on mount, which is too late: someone who chose
       light while their OS is dark would see a flash of dark first. This runs
       synchronously in <head>, so the correct ground is painted immediately.
      */
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {
        /* Private windows throw on localStorage; system preference is a fine default. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
